buildscript {
    repositories {
        maven {
            name = 'aliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
        maven {
            url = 'https://jitpack.io'
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.tweaker-client'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

version = "Release"
group= "me.eldodebug"
archivesBaseName = "SoarClient"

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = "1.8.9"
    tweakClass = "me.eldodebug.soar.injection.mixin.SoarTweaker"
    runDir = "run"
    mappings = "stable_22"
    clientJvmArgs = ["-XX:-DisableExplicitGC"]
    makeObfSourceJar = false
}

repositories {
    maven {
        name 'aliyunPublic'
        url 'https://maven.aliyun.com/repository/public'
    }

    maven {
        name "jitpack"
        url "https://jitpack.io"
    }

    maven {
        name "spongepowered"
        url "https://repo.spongepowered.org/maven/"
    }
    maven {
        name "forge"
        url "https://maven.minecraftforge.net"
    }
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    embed('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
    }
}

mixin {
    defaultObfuscationEnv = "notch"
    add sourceSets.main, "mixins.soar.refmap.json"
}

processResources {
    inputs.files "src/main/resources"
    outputs.dir "build/classes/main"
    copy {
        from("src/main/resources")
        into("build/classes/main")
    }
}

jar {
    dependsOn configurations.compile
    from {
        configurations.embed.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

jar {
    manifest.attributes(
            "MixinConfigs": 'mixins.soar.json',
            "TweakClass": 'me.eldodebug.soar.injection.mixin.SoarTweaker',
            "TweakOrder": 0,
            "Manifest-Version": 1.0,
            'FMLAT': 'soar_at.cfg'
    )

    configurations.embed.each { dep ->
        from(project.zipTree(dep)) {
            exclude 'META-INF', 'META-INF/**'
        }
    }
}

// ---------------------------------------------------------------------------
// Standalone (vanilla 1.8.9) distribution:
//   SoarClient.jar + complete 1.8.9 libraries + vanilla client jar + start scripts
//   + an iOS (Amethyst/Pojav) compatible version json.
// ---------------------------------------------------------------------------

def distDir = new File(buildDir, "dist")
def libraryCacheDir = new File(buildDir, "cache/libraries")
def localLibs = [
        'Java-WebSocket-1.5.4.jar'                 : 'local.soar:java-websocket:1.5.4',
        'ViaVersion-4.7.0-1.20-pre2-SNAPSHOT.jar'  : 'local.soar:viaversion:4.7.0',
        'ViaBackwards-4.7.0-1.20-pre1-SNAPSHOT.jar': 'local.soar:viabackwards:4.7.0',
        'ViaRewind-2.0.4-SNAPSHOT.jar'              : 'local.soar:viarewind:2.0.4',
        'jcef.jar'                                  : 'local.soar:jcef:1.0',
        'jfxrt.jar'                                 : 'local.soar:jfxrt:8.0',
        'jfxswt.jar'                                : 'local.soar:jfxswt:8.0',
        'lwjgl-soar.jar'                            : 'local.soar:lwjgl-soar:2.9.4',
        'lwjgl-soar-natives.jar'                    : 'local.soar:lwjgl-soar-natives:2.9.4',
        'slf4j-api-2.0.7.jar'                       : 'local.soar:slf4j-api:2.0.7',
        'snakeyaml-2.0.jar'                         : 'local.soar:snakeyaml:2.0'
]
def extraLibraries = localLibs.values().collect { [name: it] } + [
        [name: 'net.minecraft:launchwrapper:1.12'],
        [name: 'local.soar:soarclient:Release']
]

def coordsToPath = { String coords ->
    def parts = coords.split(':')
    return parts[0].replace('.', '/') + '/' + parts[1] + '/' + parts[2] + '/' + parts[1] + '-' + parts[2] + '.jar'
}

def downloadFile = { String url, File dest ->
    if (dest.exists() && dest.length() > 100) {
        return
    }
    dest.parentFile.mkdirs()
    println "Download ${url}"
    def connection = new URL(url).openConnection()
    connection.connectTimeout = 30000
    connection.readTimeout = 120000
    connection.inputStream.withCloseable { input ->
        dest.withOutputStream { output ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                output.write(buffer, 0, read)
            }
        }
    }
}

task prepareDist(dependsOn: ['reobfJar', 'getVersionJson']) {
    group = 'distribution'
    description = 'Assembles the standalone 1.8.9 classpath distribution.'

    doLast {
        if (distDir.exists()) {
            distDir.deleteDir()
        }
        distDir.mkdirs()

        def versionJsonFile = new File(gradle.gradleUserHomeDir, "caches/minecraft/versionJsons/1.8.9.json")
        if (!versionJsonFile.isFile()) {
            throw new GradleException("Missing 1.8.9 version json: ${versionJsonFile}")
        }
        def versionJson = new groovy.json.JsonSlurper().parse(versionJsonFile)

        def libraryFiles = []

        // 1. Complete vanilla 1.8.9 libraries (downloaded into maven layout).
        versionJson.libraries.each { library ->
            def artifact = library.downloads?.artifact
            if (artifact == null || artifact.path == null || artifact.url == null) {
                return
            }
            def cached = new File(libraryCacheDir, artifact.path)
            downloadFile(artifact.url, cached)
            def destination = new File(distDir, "libraries/" + artifact.path)
            destination.parentFile.mkdirs()
            destination.bytes = cached.bytes
            libraryFiles << destination
        }

        // 2. The client's own dependencies from libs/.
        localLibs.each { fileName, coords ->
            def source = new File(projectDir, "libs/" + fileName)
            if (!source.isFile()) {
                throw new GradleException("Missing bundled library: ${source}")
            }
            def destination = new File(distDir, "libraries/" + coordsToPath(coords))
            destination.parentFile.mkdirs()
            destination.bytes = source.bytes
            libraryFiles << destination
        }

        // 3. Launchwrapper (vanilla does not ship it, the client needs it).
        def launchWrapper = new File(distDir, "libraries/" + coordsToPath('net.minecraft:launchwrapper:1.12'))
        def launchWrapperCache = new File(libraryCacheDir, coordsToPath('net.minecraft:launchwrapper:1.12'))
        downloadFile("https://libraries.minecraft.net/net/minecraft/launchwrapper/1.12/launchwrapper-1.12.jar", launchWrapperCache)
        launchWrapper.parentFile.mkdirs()
        launchWrapper.bytes = launchWrapperCache.bytes
        libraryFiles << launchWrapper

        // 4. The reobfuscated client jar.
        def clientJar = new File(distDir, "libraries/" + coordsToPath('local.soar:soarclient:Release'))
        clientJar.parentFile.mkdirs()
        clientJar.bytes = tasks.reobfJar.jar.bytes
        libraryFiles << clientJar

        // 5. Vanilla client jar, used both as the version jar and for start scripts.
        def vanillaClient = new File(gradle.gradleUserHomeDir, "caches/minecraft/net/minecraft/minecraft/1.8.9/minecraft-1.8.9.jar")
        if (!vanillaClient.isFile()) {
            throw new GradleException("Missing vanilla client jar: ${vanillaClient}")
        }
        def versionJar = new File(distDir, "versions/SoarClient/SoarClient.jar")
        versionJar.parentFile.mkdirs()
        versionJar.bytes = vanillaClient.bytes

        // 6. Version json for iOS launchers (Amethyst / Pojav style, inheritsFrom 1.8.9).
        def versionDir = new File(distDir, "versions/SoarClient")
        def baseVersionDir = new File(distDir, "versions/1.8.9")
        baseVersionDir.mkdirs()
        new File(baseVersionDir, "1.8.9.json").bytes = versionJsonFile.bytes
        def tweakClass = "me.eldodebug.soar.injection.mixin.SoarTweaker"
        def customVersion = [
                id                 : 'SoarClient',
                inheritsFrom       : '1.8.9',
                type               : 'release',
                mainClass          : 'net.minecraft.launchwrapper.Launch',
                minecraftArguments : versionJson.minecraftArguments + " --tweakClass " + tweakClass,
                libraries          : extraLibraries.collect { [name: it.name, downloads: [artifact: [path: coordsToPath(it.name)]]] }
        ]
        def json = new groovy.json.JsonBuilder(customVersion)
        new File(versionDir, "SoarClient.json").withWriter('UTF-8') { it.write(json.toPrettyString()) }

        // 7. Start scripts (relative paths, explicit classpath).
        def classpathEntries = libraryFiles.collect { file ->
            file.absolutePath.substring(distDir.absolutePath.length() + 1)
        } + ["versions/SoarClient/SoarClient.jar"]

        def batClasspath = classpathEntries.collect { '%DIR%\\' + it.replace('/', '\\') }.join(';')
        def shClasspath = classpathEntries.collect { '$DIR/' + it }.join(':')

        new File(distDir, "start.bat").withWriter('UTF-8') { writer ->
            writer.write("@echo off\n")
            writer.write("setlocal\n")
            writer.write("set DIR=%~dp0\n")
            writer.write("set JAVA=javaw\n")
            writer.write("if not exist \"%DIR%game\" mkdir \"%DIR%game\"\n")
            writer.write("set CP=${batClasspath}\n")
            writer.write("\"%JAVA%\" -Xmx4G -Djava.library.path=\"%DIR%natives\" -cp \"%CP%\" net.minecraft.launchwrapper.Launch ")
            writer.write("--version 1.8.9 --username \"Soar User\" --uuid 0 --accessToken 0 ")
            writer.write("--gameDir \"%DIR%game\" --assetsDir \"%DIR%assets\" --assetIndex 1.8 ")
            writer.write("--tweakClass ${tweakClass}\n")
        }

        new File(distDir, "start.sh").withWriter('UTF-8') { writer ->
            writer.write("#!/bin/sh\n")
            writer.write("DIR=\$(cd \"\$(dirname \"\$0\")\" && pwd)\n")
            writer.write("mkdir -p \"\$DIR/game\"\n")
            writer.write("CP=${shClasspath}\n")
            writer.write("exec java -Xmx4G -Djava.library.path=\"\$DIR/natives\" -cp \"\$CP\" net.minecraft.launchwrapper.Launch ")
            writer.write("--version 1.8.9 --username \"Soar User\" --uuid 0 --accessToken 0 ")
            writer.write("--gameDir \"\$DIR/game\" --assetsDir \"\$DIR/assets\" --assetIndex 1.8 ")
            writer.write("--tweakClass ${tweakClass}\n")
        }
        new File(distDir, "start.sh").setExecutable(true)

        new File(distDir, "安装说明.txt").withWriter('UTF-8') { writer ->
            writer.write("SoarClient standalone (vanilla 1.8.9)\n")
            writer.write("\n")
            writer.write("桌面端：把 assets/ 和 natives/ 补全后运行 start.bat (Windows) 或 start.sh (Linux/macOS)。\n")
            writer.write("iOS (Amethyst/Pojav)：\n")
            writer.write("1. 把 libraries/ 下的全部文件复制到启动器的 libraries/ 目录（保持 maven 子目录结构）。\n")
            writer.write("2. 把 versions/ 下的 SoarClient 和 1.8.9 目录复制到启动器的 versions/ 目录。\n")
            writer.write("3. 在启动器中新建/选择版本 SoarClient（继承 1.8.9，非 Forge），启动即可。\n")
            writer.write("   （若启动器里已有原版 1.8.9，可跳过 versions/1.8.9/；assets 由启动器提供。）\n")
        }

        println "Distribution assembled in ${distDir}"
    }
}

task distZip(type: Zip, dependsOn: 'prepareDist') {
    group = 'distribution'
    description = 'Zips the standalone distribution.'
    archiveName = "SoarClient-standalone-${version}.zip"
    destinationDir = new File(buildDir, "distributions")
    from(distDir)
}
