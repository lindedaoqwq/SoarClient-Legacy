buildscript {
    repositories {
        maven {
            name = 'aliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
        maven {
            url = 'https://jitpack.io'
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.tweaker-client'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

version = "Release"
group= "me.eldodebug"
archivesBaseName = "SoarClient"

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = "1.8.9"
    tweakClass = "me.eldodebug.soar.injection.mixin.SoarTweaker"
    runDir = "run"
    mappings = "stable_22"
    clientJvmArgs = ["-XX:-DisableExplicitGC"]
    makeObfSourceJar = false
}

repositories {
    maven {
        name 'aliyunPublic'
        url 'https://maven.aliyun.com/repository/public'
    }

    maven {
        name "jitpack"
        url "https://jitpack.io"
    }

    maven {
        name "spongepowered"
        url "https://repo.spongepowered.org/maven/"
    }
    maven {
        name "forge"
        url "https://maven.minecraftforge.net"
    }
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    embed('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
    }
}

mixin {
    defaultObfuscationEnv = "notch"
    add sourceSets.main, "mixins.soar.refmap.json"
}

processResources {
    inputs.files "src/main/resources"
    outputs.dir "build/classes/main"
    copy {
        from("src/main/resources")
        into("build/classes/main")
    }
}

jar {
    dependsOn configurations.compile
    from {
        configurations.embed.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

jar {
    manifest.attributes(
            "MixinConfigs": 'mixins.soar.json',
            "TweakClass": 'me.eldodebug.soar.injection.mixin.SoarTweaker',
            "TweakOrder": 0,
            "Manifest-Version": 1.0,
            'FMLAT': 'soar_at.cfg'
    )

    configurations.embed.each { dep ->
        from(project.zipTree(dep)) {
            exclude 'META-INF', 'META-INF/**'
        }
    }
}

// ---------------------------------------------------------------------------
// Standalone (vanilla 1.8.9) distribution, mirroring the upstream release zip:
//   start.bat / start.sh, libraries/*.jar (flat), minecraft/1.8.9.jar,
//   minecraft/SoarClient.jar, natives/ (Windows), game/
// ---------------------------------------------------------------------------

def distDir = new File(buildDir, "dist")
def libraryCacheDir = new File(buildDir, "cache/libraries")
def localLibs = [
        'Java-WebSocket-1.5.4.jar',
        'ViaVersion-4.7.0-1.20-pre2-SNAPSHOT.jar',
        'ViaBackwards-4.7.0-1.20-pre1-SNAPSHOT.jar',
        'ViaRewind-2.0.4-SNAPSHOT.jar',
        'jcef.jar',
        'jfxrt.jar',
        'jfxswt.jar',
        'lwjgl-soar.jar',
        'lwjgl-soar-natives.jar',
        'slf4j-api-2.0.7.jar',
        'snakeyaml-2.0.jar'
]

def flatName = { String path -> path.tokenize('/').last() }

def downloadFile = { String url, File dest ->
    if (dest.exists() && dest.length() > 100) {
        return
    }
    dest.parentFile.mkdirs()
    println "Download ${url}"
    def connection = new URL(url).openConnection()
    connection.connectTimeout = 30000
    connection.readTimeout = 120000
    connection.inputStream.withCloseable { input ->
        dest.withOutputStream { output ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                output.write(buffer, 0, read)
            }
        }
    }
}

def extractJar = { File jarFile, File targetDir ->
    def zip = new java.util.zip.ZipFile(jarFile)
    try {
        zip.entries().each { entry ->
            if (!entry.isDirectory() && !entry.name.startsWith('META-INF/')) {
                def target = new File(targetDir, flatName(entry.name))
                target.parentFile.mkdirs()
                zip.getInputStream(entry).withCloseable { input ->
                    target.withOutputStream { output ->
                        byte[] buffer = new byte[8192]
                        int read
                        while ((read = input.read(buffer)) != -1) {
                            output.write(buffer, 0, read)
                        }
                    }
                }
            }
        }
    } finally {
        zip.close()
    }
}


task prepareDist(dependsOn: ['reobfJar', 'getVersionJson']) {
    group = 'distribution'
    description = 'Assembles the standalone 1.8.9 classpath distribution.'

    doLast {
        if (distDir.exists()) {
            distDir.deleteDir()
        }
        distDir.mkdirs()

        def versionJsonFile = new File(gradle.gradleUserHomeDir, "caches/minecraft/versionJsons/1.8.9.json")
        if (!versionJsonFile.isFile()) {
            throw new GradleException("Missing 1.8.9 version json: ${versionJsonFile}")
        }
        def versionJson = new groovy.json.JsonSlurper().parse(versionJsonFile)

        def tweakClass = "me.eldodebug.soar.injection.mixin.SoarTweaker"
        def librariesDir = new File(distDir, "libraries")
        librariesDir.mkdirs()

        // 1. Complete vanilla 1.8.9 libraries, flat like the upstream release zip.
        versionJson.libraries.each { library ->
            def artifact = library.downloads?.artifact
            if (artifact == null || artifact.path == null || artifact.url == null) {
                return
            }
            def cached = new File(libraryCacheDir, artifact.path)
            downloadFile(artifact.url, cached)
            def destination = new File(librariesDir, flatName(artifact.path))
            destination.bytes = cached.bytes
        }

        // 2. The client's own dependencies from libs/.
        localLibs.each { fileName ->
            def source = new File(projectDir, "libs/" + fileName)
            if (!source.isFile()) {
                throw new GradleException("Missing bundled library: ${source}")
            }
            new File(librariesDir, fileName).bytes = source.bytes
        }

        // 3. Launchwrapper (vanilla does not ship it, the client needs it).
        def launchWrapperCache = new File(libraryCacheDir, "net/minecraft/launchwrapper/1.12/launchwrapper-1.12.jar")
        downloadFile("https://libraries.minecraft.net/net/minecraft/launchwrapper/1.12/launchwrapper-1.12.jar", launchWrapperCache)
        new File(librariesDir, "launchwrapper-1.12.jar").bytes = launchWrapperCache.bytes

        // 3b. ASM is used directly by the lwjgl transformer (the client jar only shades Mixin's copy).
        def asmCache = new File(libraryCacheDir, "org/ow2/asm/asm-all/5.0.3/asm-all-5.0.3.jar")
        downloadFile("https://libraries.minecraft.net/org/ow2/asm/asm-all/5.0.3/asm-all-5.0.3.jar", asmCache)
        new File(librariesDir, "asm-all-5.0.3.jar").bytes = asmCache.bytes

        // 4. minecraft/1.8.9.jar + minecraft/SoarClient.jar
        def vanillaClient = new File(gradle.gradleUserHomeDir, "caches/minecraft/net/minecraft/minecraft/1.8.9/minecraft-1.8.9.jar")
        if (!vanillaClient.isFile()) {
            throw new GradleException("Missing vanilla client jar: ${vanillaClient}")
        }
        def minecraftDir = new File(distDir, "minecraft")
        minecraftDir.mkdirs()
        new File(minecraftDir, "1.8.9.jar").bytes = vanillaClient.bytes
        new File(minecraftDir, "SoarClient.jar").bytes = tasks.reobfJar.jar.bytes

        // 5. Windows natives, extracted flat like the upstream release zip.
        def nativesDir = new File(distDir, "natives")
        nativesDir.mkdirs()
        versionJson.libraries.each { library ->
            if (library.name.startsWith('org.lwjgl.lwjgl:lwjgl-platform:2.9.2')) {
                return
            }
            def windowsClassifier = library.natives?.windows
            if (windowsClassifier == null) {
                return
            }
            def classifier = windowsClassifier.contains('${arch}') ? 'natives-windows-64' : windowsClassifier
            def nativeArtifact = library.downloads?.classifiers?.get(classifier)
            if (nativeArtifact == null || nativeArtifact.url == null) {
                return
            }
            def cached = new File(libraryCacheDir, nativeArtifact.path)
            downloadFile(nativeArtifact.url, cached)
            extractJar(cached, nativesDir)
        }

        new File(distDir, "game").mkdirs()

        // 6. Start scripts, same classpath convention as the upstream zip.
        new File(distDir, "start.bat").withWriter('UTF-8') { writer ->
            writer.write("@echo off\n")
            writer.write("setlocal enabledelayedexpansion\n")
            writer.write("set DIR=%~dp0\n")
            writer.write("if exist \"%DIR%java\\bin\\javaw.exe\" (\n")
            writer.write("    set JAVA_EXEC=\"%DIR%java\\bin\\javaw.exe\"\n")
            writer.write(") else (\n")
            writer.write("    set JAVA_EXEC=javaw\n")
            writer.write(")\n")
            writer.write("if not exist \"%DIR%game\" mkdir \"%DIR%game\"\n")
            writer.write("set CP=\n")
            writer.write("for %%f in (\"%DIR%libraries\\*.jar\") do set CP=!CP!%%f;\n")
            writer.write("set CP=%CP%%DIR%minecraft\\1.8.9.jar;%DIR%minecraft\\SoarClient.jar\n")
            writer.write("%JAVA_EXEC% -Xmx4G -Djava.library.path=\"%DIR%natives\" -cp \"%CP%\" net.minecraft.launchwrapper.Launch ")
            writer.write("--accessToken 0 --version 1.8.9 --username \"Soar User\" --uuid 0 ")
            writer.write("--gameDir \"%DIR%game\" --assetsDir \"%DIR%assets\" --assetIndex 1.8 ")
            writer.write("--tweakClass ${tweakClass}\n")
            writer.write("endlocal\n")
        }

        new File(distDir, "start.sh").withWriter('UTF-8') { writer ->
            writer.write('#!/bin/sh\n')
            writer.write('DIR=$(cd "$(dirname "$0")" && pwd)\n')
            writer.write('mkdir -p "$DIR/game"\n')
            writer.write('CP=""\n')
            writer.write('for jar in "$DIR"/libraries/*.jar; do CP="$CP:$jar"; done\n')
            writer.write('CP="$DIR/minecraft/1.8.9.jar:$DIR/minecraft/SoarClient.jar$CP"\n')
            writer.write('exec java -Xmx4G -Djava.library.path="$DIR/natives" -cp "$CP" net.minecraft.launchwrapper.Launch ')
            writer.write('--accessToken 0 --version 1.8.9 --username "Soar User" --uuid 0 ')
            writer.write('--gameDir "$DIR/game" --assetsDir "$DIR/assets" --assetIndex 1.8 ')
            writer.write("--tweakClass ${tweakClass}\n")
        }
        new File(distDir, "start.sh").setExecutable(true)

        new File(distDir, "安装说明.txt").withWriter('UTF-8') { writer ->
            writer.write("SoarClient standalone (vanilla 1.8.9, upstream zip layout)\n")
            writer.write("\n")
            writer.write("Windows：双击 start.bat。需要 Java 8；也可以把 JRE 解压成 java/ 目录（脚本会自动使用）。\n")
            writer.write("Linux/macOS：./start.sh（需自行把对应平台的 LWJGL natives 放进 natives/）。\n")
            writer.write("assets/ 未内置：把 1.8 资源放进 assets/，或改 start 脚本里的 --assetsDir 指向启动器资源目录。\n")
            writer.write("Forge 用户：改用 SoarClient-Forge-*-full.jar 放进 mods/，不要用这个包。\n")
        }

        println "Distribution assembled in ${distDir}"
    }
}

task distZip(type: Zip, dependsOn: 'prepareDist') {
    group = 'distribution'
    description = 'Zips the standalone distribution.'
    archiveName = "SoarClient-standalone-${version}.zip"
    destinationDir = new File(buildDir, "distributions")
    from(distDir)
}
